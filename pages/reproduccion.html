<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Reproducción - RuralData</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body>
  <main class="container py-4">

    <a href="../index.html" class="btn btn-outline-secondary mb-3">
      Volver
    </a>

    <section id="usuarioActivo"></section>

    <h1 class="h3 fw-bold mb-3">Reproducción</h1>

    <form id="formReproduccion" class="d-grid gap-3 mb-4">

      <input
        type="text"
        id="identificadorAnimal"
        class="form-control"
        placeholder="Caravana o RFID del animal"
        required
      />

      <select id="estadoReproductivo" class="form-select" required>
        <option value="">Estado reproductivo</option>
        <option value="En gestación">En gestación</option>
        <option value="Próxima a parir">Próxima a parir</option>
        <option value="Lista para entorar">Lista para entorar</option>
        <option value="Parida">Parida</option>
      </select>

      <label>Fecha estimada de parto</label>
      <input
        type="date"
        id="fechaEstimadaParto"
        class="form-control"
      />

      <label>Días de aviso previo</label>
      <select id="diasAviso" class="form-select">
        <option value="10">10 días antes</option>
        <option value="15" selected>15 días antes</option>
      </select>

      <textarea
        id="observacionesReproduccion"
        class="form-control"
        rows="3"
        placeholder="Observaciones"
      ></textarea>

      <button type="submit" class="btn btn-success btn-lg">
        Guardar registro
      </button>

    </form>

    <h2 class="h5 fw-bold mb-3">Registros reproductivos</h2>

    <section id="listaReproduccion" class="d-grid gap-3"></section>

  </main>

  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/reproduccion.js"></script>
</body>
</html>
