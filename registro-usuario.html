<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - RuralData</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-body">
  <main class="login-wrapper">
    <section class="mb-4">
      <h1 class="login-title">Registrar productor<br />en RuralData.</h1>
      <p class="login-subtitle">Tu cuenta y tu establecimiento, con datos independientes.</p>
    </section>
    <section class="login-card">
      <form id="formRegistroUsuario" class="d-grid gap-3">
        <div>
          <label for="nombreRegistro" class="form-label">Nombre completo</label>
          <input type="text" id="nombreRegistro" class="form-control" autocomplete="name" maxlength="120" required />
        </div>
        <div>
          <label for="usuarioRegistro" class="form-label">Correo electrónico</label>
          <input type="email" id="usuarioRegistro" class="form-control" autocomplete="username" maxlength="254" required />
        </div>
        <div>
          <label for="passwordRegistro" class="form-label">Contraseña</label>
          <input type="password" id="passwordRegistro" class="form-control" autocomplete="new-password" minlength="12" maxlength="256" required />
          <small>Mínimo 12 caracteres.</small>
        </div>
        <div>
          <label for="establecimientoRegistro" class="form-label">Nombre del establecimiento</label>
          <input type="text" id="establecimientoRegistro" class="form-control" maxlength="160" required />
        </div>
        <button type="submit" id="btnRegistrarProductor" class="btn btn-success btn-lg">Registrar productor</button>
        <a href="login.html" class="btn btn-outline-secondary">Volver al ingreso</a>
        <div id="mensajeRegistroUsuario" role="status"></div>
      </form>
    </section>
  </main>
  <script type="module" src="js/integracion-mvp.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
