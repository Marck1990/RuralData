<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ingreso - RuralData</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <main class="container py-4 home-container">

    <section class="text-center mb-4">
      <h1 class="fw-bold">RuralData</h1>
      <p class="text-muted">Ingreso de usuarios</p>
    </section>

    <form id="formLogin" class="d-grid gap-3">

      <input
        type="text"
        id="usuario"
        class="form-control"
        placeholder="Usuario"
        required
      />

      <input
        type="password"
        id="password"
        class="form-control"
        placeholder="Contraseña"
        required
      />

      <button type="submit" class="btn btn-success btn-lg">
        Ingresar
      </button>

      <div id="mensajeLogin"></div>

    </form>

    <section class="mt-4 small text-muted">
      <p class="mb-1"><strong>Usuarios de prueba:</strong></p>
      <p class="mb-1">propietario / 1234</p>
      <p class="mb-1">trabajador / 1234</p>
      <p class="mb-1">veterinario / 1234</p>
    </section>

  </main>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
