<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Registro - RuralData</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="login-body">
  <main class="login-wrapper">

    <section class="mb-4">
      

      <h1 class="login-title">
        Crear usuario<br />
        en RuralData.
      </h1>

      <p class="login-subtitle">
        Registro local para trabajar desde el celular.
      </p>
    </section>

    <section class="login-card">

      <form id="formRegistroUsuario" class="d-grid gap-3">

        <div>
          <label for="nombreRegistro" class="form-label">Nombre completo</label>
          <input
            type="text"
            id="nombreRegistro"
            class="form-control"
            placeholder="Ej: Juan Pérez"
            required
          />
        </div>

        <div>
          <label for="usuarioRegistro" class="form-label">Usuario</label>
          <input
            type="text"
            id="usuarioRegistro"
            class="form-control"
            placeholder="Ej: juanperez"
            required
          />
        </div>

        <div>
          <label for="passwordRegistro" class="form-label">Contraseña</label>
          <input
            type="password"
            id="passwordRegistro"
            class="form-control"
            placeholder="Ingrese una contraseña"
            required
          />
        </div>

        <div>
          <label for="rolRegistro" class="form-label">Rol</label>
          <select id="rolRegistro" class="form-select" required>
            <option value="">Seleccione un rol</option>
            <option value="propietario">Propietario</option>
            <option value="trabajador">Trabajador</option>
            <option value="veterinario">Veterinario</option>
          </select>
        </div>

        <button type="submit" class="btn btn-success btn-lg">
          Crear usuario
        </button>

        <a href="login.html" class="btn btn-outline-secondary">
          Volver al ingreso
        </a>

        <div id="mensajeRegistroUsuario"></div>

      </form>

    </section>

  </main>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
