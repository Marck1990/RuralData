<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ingreso - RuralData</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="login-body">
  <main class="login-wrapper">

    <section class="mb-4">
      <div class="login-logo">🌱</div>

      <h1 class="login-title">
        La información del rodeo,<br />
        siempre a mano.
      </h1>

      <p class="login-subtitle">
        Información clara para decisiones en el campo.
      </p>
    </section>

    <section class="login-card">
      <p class="mb-4">
        Acceso de demostración para recorrer RuralData.
      </p>

      <form id="formLogin" class="d-grid gap-3">

        <div>
          <label for="usuario" class="form-label">Usuario</label>
          <input
            type="text"
            id="usuario"
            class="form-control"
            placeholder="propietario, trabajador o veterinario"
            required
          />
        </div>

        <div>
          <label for="password" class="form-label">Contraseña</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="1234"
            required
          />
        </div>

        <button type="submit" class="btn btn-success btn-lg">
          Ingresar
        </button>

        <div id="mensajeLogin"></div>

      </form>

      <section class="mt-4 small text-muted">
        <p class="mb-1"><strong>Usuarios de prueba:</strong></p>
        <p class="mb-1">propietario / 1234</p>
        <p class="mb-1">trabajador / 1234</p>
        <p class="mb-1">veterinario / 1234</p>
      </section>
    </section>

  </main>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
